services:
  - type: web
    name: a2a-firewall-backend
    env: docker
    repo: https://github.com/mananjp/a2a-firewall
    branch: main
    dockerfilePath: ./docker/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY_SALT
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://a2a-firewall-frontend.onrender.com
      - key: OTEL_SDK_DISABLED
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # Error tracking (Sentry, free tier). Set the DSN in the Render dashboard
      # secrets; the service no-ops if it is empty.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: RATE_LIMIT_BACKEND
        value: "postgres"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DEBUG
        value: "false"

  - type: web
    name: a2a-firewall-frontend
    env: docker
    repo: https://github.com/mananjp/a2a-firewall
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://a2a-firewall-backend.onrender.com
      - key: API_BASE_URL
        value: https://a2a-firewall-backend.onrender.com
      - key: NODE_ENV
        value: production


