# ── A2A Firewall — n8n Sidecar Deployment Example ──
#
# Runs n8n behind the A2A Transparent Proxy Sidecar.
# All outbound HTTP/HTTPS calls (LLMs, webhooks, tool calls) from n8n
# flow through the proxy and are governed by A2A Firewall.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build

services:
  # ── A2A Transparent Proxy Sidecar ──
  a2a-proxy:
    build:
      context: ../../backend
      dockerfile: ../docker/Dockerfile.proxy
    container_name: a2a_n8n_proxy
    restart: unless-stopped
    volumes:
      - ca-certs:/data/ca
    ports:
      - "8080:8080"
    environment:
      A2A_FIREWALL_URL: "${A2A_FIREWALL_URL:-http://backend:8000}"
      A2A_API_KEY: "${A2A_API_KEY}"
      PROXY_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - a2a-network

  # ── n8n Automation Engine ──
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: a2a_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      a2a-proxy:
        condition: service_healthy
    environment:
      - HTTP_PROXY=http://a2a-proxy:8080
      - HTTPS_PROXY=http://a2a-proxy:8080
      # Critical: DO NOT proxy internal communication or the firewall backend itself
      - NO_PROXY=localhost,127.0.0.1,backend,a2a-proxy
      # Trust the dynamic CA certificate generated by the proxy for TLS MITM inspection
      - NODE_EXTRA_CA_CERTS=/certs/ca.crt
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n-a2a-firewall-secure-encryption-key}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n-data:/home/node/.n8n
      - ca-certs:/certs:ro
    networks:
      - a2a-network

volumes:
  ca-certs:
  n8n-data:

networks:
  a2a-network:
    driver: bridge
