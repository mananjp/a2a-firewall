# ── A2A Firewall — Docker Sidecar Deployment Example ──
#
# Demonstrates the Tier A transparent proxy architecture:
# 1. a2a-proxy sidecar intercepts all HTTPS traffic
# 2. sample-agent runs with HTTPS_PROXY pointing to the sidecar
# 3. (optional) a2a-backend provides full 5-layer detection pipeline
#
# Usage:
#   docker compose up --build
#
# The sample agent will make HTTP calls that get transparently intercepted,
# inspected, and governed by the A2A proxy — with zero code changes.

services:
  # ── A2A Transparent Proxy Sidecar ──
  a2a-proxy:
    build:
      context: ../../backend
      dockerfile: ../docker/Dockerfile.proxy
    container_name: a2a_proxy_sidecar
    restart: unless-stopped
    volumes:
      - ca-certs:/data/ca
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - a2a-governed

  # ── Your Agent Container (sample) ──
  # Replace this with your actual agent image.
  # The only changes needed are the environment variables below.
  sample-agent:
    build:
      context: ./sample-agent
      dockerfile: Dockerfile
    container_name: a2a_sample_agent
    restart: "no"
    depends_on:
      a2a-proxy:
        condition: service_healthy
    environment:
      # ── These 4 env vars are all you need ──
      HTTP_PROXY: "http://a2a-proxy:8080"
      HTTPS_PROXY: "http://a2a-proxy:8080"
      SSL_CERT_FILE: "/certs/ca.crt"
      REQUESTS_CA_BUNDLE: "/certs/ca.crt"
      NODE_EXTRA_CA_CERTS: "/certs/ca.crt"
      CURL_CA_BUNDLE: "/certs/ca.crt"

      # Agent's own config (replace with your values)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-sk-demo-not-a-real-key}"
    volumes:
      - ca-certs:/certs:ro
    networks:
      - a2a-governed

volumes:
  ca-certs:

networks:
  a2a-governed:
    driver: bridge
